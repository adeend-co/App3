<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- Background -->
    <rect width="512" height="512" fill="#e0f2fe" rx="100"/>
    
    <!-- Drop Shadow for the Oil Drop -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="15" stdDeviation="15" flood-opacity="0.2"/>
    </filter>

    <!-- The Oil Drop -->
    <path filter="url(#shadow)" fill="#2563eb" d="M 256.00 70.00 C 256.00 70.00 136.00 240.23 136.00 336.00 C 136.00 402.27 189.73 456.00 256.00 456.00 C 322.27 456.00 376.00 402.27 376.00 336.00 C 376.00 240.23 256.00 70.00 256.00 70.00 Z"/>
    
    <!-- Sparkle/Highlight on the drop -->
    <path fill="#60a5fa" d="M 186.00 336.00 C 186.00 293.00 216.00 251.00 236.00 220.00 C 206.00 270.00 170.00 320.00 210.00 380.00 C 190.00 360.00 186.00 346.00 186.00 336.00 Z"/>

    <!-- Chart line inside the drop -->
    <polyline points="196,356 236,316 276,336 316,276" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrow tip for the chart -->
    <polyline points="296,276 316,276 316,296" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
